# Standalone extraction of the XFChess Solana program for security analysis.
# Source of truth: https://github.com/trilltino/XFChess (programs/xfchess-game).
# Dependency pins are copied verbatim from that repo's workspace Cargo.toml.
[workspace]
resolver = "2"
members = ["programs/xfchess-game", "programs/xfchess-game-sbf", "crates/nimzovich_engine", "crates/xfchess-rules"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["trilltino"]
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/trilltino/XFChess"

[workspace.dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
solana-program = "=3.0.0"
solana-program-test = "=3.1.12"
solana-sdk = "=3.0.0"
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "instruction"] }
solana-security-txt = "=1.1.3"
bincode = "=1.3.3"
tokio = { version = "=1.53.1", features = ["full"] }
base64 = "=0.22"
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.18"
futures-lite = "=2.6.1"
# Vendored from XFChess commit bfaa6a133^ (the last revision before the engine
# was extracted to its own repo). Compiled into the program via `move-validation`.
nimzovich_engine = { path = "crates/nimzovich_engine", default-features = false }
xfchess-rules = { path = "crates/xfchess-rules" }
anyhow = "=1.0.102"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[profile.release.package.xfchess-game]
opt-level = "z"
codegen-units = 1

# The deployable build compiles the program through this shim (programs/xfchess-game-sbf),
# so its package name carries the size-optimised profile.
[profile.release.package.xfchess-game-sbf]
opt-level = "z"
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }
