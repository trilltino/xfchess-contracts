# Standalone extraction; source of truth: trilltino/XFChess/programs.

[workspace]
resolver = "2"
members = ["programs/xfchess-game", "programs/xfchess-game-sbf", "crates/nimzovich_engine", "crates/xfchess-rules", "crates/xfchess-client-compat"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/trilltino/XFChess"

[workspace.dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["init-if-needed", "solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions", "solana-v4"] }
anyhow = "=1.0.104"
async-trait = "=0.1.92"

base64 = "=0.23.1"
ephemeral-rollups-sdk = { version = "=0.17.3", default-features = false, features = ["instruction", "solana-system-interface"] }
nimzovich_engine = { path = "crates/nimzovich_engine", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
solana-program = "=5.1.0"
solana-program-test = { version = "=4.3.2", features = ["agave-unstable-api"] }
solana-sdk = "=5.0.0"
solana-security-txt = "=1.1.3"
tokio = { version = "=1.54.1", features = ["full"] }
xfchess-client-compat = { path = "crates/xfchess-client-compat" }
xfchess-rules = { path = "crates/xfchess-rules" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[profile.release.build-override]
opt-level = 3

[profile.release.package.xfchess-game]
opt-level = "z"
codegen-units = 1

[profile.release.package.xfchess-game-sbf]
opt-level = "z"
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rust.unexpected_cfgs]
level = "allow"

[profile.dev]
strip = "debuginfo"
